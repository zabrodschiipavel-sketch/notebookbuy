name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Зависимости не закреплены, а ежедневный скрапер каждое утро ставит их
  # заново. Без запуска по расписанию поломка от новой версии зависимости
  # всплыла бы только при следующем коммите — а его может не быть месяцами.
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        run: pytest -v
