name: Daily Laptop Scraper

on:
  schedule:
    # Запуск каждый день в 06:00 UTC (09:00 по времени Молдовы)
    - cron: '0 6 * * *'
  workflow_dispatch: # Позволяет запускать вручную из интерфейса GitHub

jobs:
  scrape-and-analyze:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      # Восстанавливаем БД и кэш-файлы из кэша GitHub Actions
      - name: Restore Scraper Cache & DB
        uses: actions/cache/restore@v5
        with:
          path: |
            laptops_database.db
            pricehistory_cache.json
            notebookcheck_cache.json
            digest_history.json
          key: scraper-db-cache-${{ github.run_id }}
          restore-keys: |
            scraper-db-cache-

      # Запуск сбора объявлений по всей Молдове
      - name: Run Scraper (All Moldova)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python lappars.py --once --region all

      # Запуск анализатора и генерации отчетов
      - name: Run Analyzer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python laptop_analyzer_v3.py

      # Отправляем сводку лучших сделок в Telegram
      # (GEMINI_API_KEY нужен для финального ревью топа через Gemini Pro;
      # скрипт также пишет digest_history.json для пометок «уже в топе»)
      - name: Send Telegram Notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python send_telegram.py

      # Сохраняем обновленную БД и кэш-файлы обратно в кэш — после отправки,
      # чтобы попала и история дайджестов (если шаг упал — данные не теряются)
      - name: Save Scraper Cache & DB
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            laptops_database.db
            pricehistory_cache.json
            notebookcheck_cache.json
            digest_history.json
          key: scraper-db-cache-${{ github.run_id }}

      # Загружаем сгенерированные текстовые и CSV отчеты как артефакты сборки
      - name: Upload Analysis Reports
        uses: actions/upload-artifact@v7
        with:
          name: laptop-reports
          path: |
            top_laptops_*.txt
            pricehistory_cache.json
            notebookcheck_cache.json
          retention-days: 7
